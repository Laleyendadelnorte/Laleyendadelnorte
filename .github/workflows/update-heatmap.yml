name: Update contribution heatmap

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-heatmap
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate contribution heatmaps
        run: node generate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit updated SVG files
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- dark.svg light.svg)" ]]; then
            echo "Contribution heatmaps are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update contribution heatmap"
          git push
